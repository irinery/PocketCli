name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    name: Build and smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            ci_profile: linux
          - name: macos
            os: macos-latest
            ci_profile: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true   # restaura módulos e build cache automaticamente

      - name: Run go vet
        run: |
          VET_LOG="/tmp/pocket-vet-${{ matrix.ci_profile }}.log"
          if go vet ./... >"${VET_LOG}" 2>&1; then
            VET_EXIT=0
          else
            VET_EXIT=$?
          fi
          cat "${VET_LOG}"
          exit "${VET_EXIT}"

      - name: Run menu regression suite
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          MENU_LOG="/tmp/pocket-menu-${{ matrix.ci_profile }}.log"
          MENU_EXIT=0
          : > "${MENU_LOG}"
          for TEST_SCRIPT in \
            tests/test_menu_fallback.sh \
            tests/test_menu_incremental_render.sh \
            tests/test_menu_no_hosts.sh \
            tests/test_menu_remove_host.sh
          do
            TEST_NAME=$(basename "${TEST_SCRIPT}")
            printf '==> %s\n' "${TEST_NAME}" >> "${MENU_LOG}"
            if sh "${TEST_SCRIPT}" >> "${MENU_LOG}" 2>&1; then
              :
            else
              MENU_EXIT=$?
              break
            fi
          done
          cat "${MENU_LOG}"
          END_TS=$(date +%s)
          printf '### Menu regressions (%s)\n' "${{ matrix.ci_profile }}" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- total: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          exit "${MENU_EXIT}"

      - name: Run shell regression suite
        env:
          POCKETCLI_CI_PROFILE: ${{ matrix.ci_profile }}
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_TEST_EXCLUDES: test_ish.sh test_menu_fallback.sh test_menu_incremental_render.sh test_menu_no_hosts.sh test_menu_remove_host.sh
        run: |
          TEST_LOG="/tmp/pocket-test-${{ matrix.ci_profile }}.log"
          if sh tests/run_all.sh >"${TEST_LOG}" 2>&1; then
            TEST_EXIT=0
          else
            TEST_EXIT=$?
          fi
          cat "${TEST_LOG}"
          exit "${TEST_EXIT}"

      - name: Run Go tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          GO_LOG="/tmp/pocket-gotest-${{ matrix.ci_profile }}.log"
          if go test ./... >"${GO_LOG}" 2>&1; then
            GO_EXIT=0
          else
            GO_EXIT=$?
          fi
          cat "${GO_LOG}"
          END_TS=$(date +%s)
          printf '### Go tests (%s)\n' "${{ matrix.ci_profile }}" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- total: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          exit "${GO_EXIT}"

      - name: Build pocket Go binary
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          BUILD_LOG="/tmp/pocket-build-${{ matrix.ci_profile }}.log"
          if go build -buildvcs=false -o /tmp/pocket-go ./cmd/pocket >"${BUILD_LOG}" 2>&1; then
            BUILD_EXIT=0
          else
            BUILD_EXIT=$?
          fi
          cat "${BUILD_LOG}"
          END_TS=$(date +%s)
          printf '### Build (%s)\n' "${{ matrix.ci_profile }}" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- pocket-go: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          exit "${BUILD_EXIT}"

      - name: Run pocket smoke tests
        env:
          POCKETCLI_CI_PROFILE: ${{ matrix.ci_profile }}
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_GO_BINARY: /tmp/pocket-go
        run: |
          SMOKE_LOG="/tmp/pocket-smoke-${{ matrix.ci_profile }}.log"
          if sh tests/run_smoke.sh >"${SMOKE_LOG}" 2>&1; then
            SMOKE_EXIT=0
          else
            SMOKE_EXIT=$?
          fi
          cat "${SMOKE_LOG}"
          exit "${SMOKE_EXIT}"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.ci_profile }}
          path: |
            /tmp/pocket-vet-${{ matrix.ci_profile }}.log
            /tmp/pocket-menu-${{ matrix.ci_profile }}.log
            /tmp/pocket-build-${{ matrix.ci_profile }}.log
            /tmp/pocket-test-${{ matrix.ci_profile }}.log
            /tmp/pocket-gotest-${{ matrix.ci_profile }}.log
            /tmp/pocket-smoke-${{ matrix.ci_profile }}.log
          retention-days: 7

  build-and-smoke-alpine:
    name: Build and smoke (alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: alpine:3.21
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "768MiB"
      POCKETCLI_CI_PROFILE: alpine
      GOCACHE: /root/.cache/go-build
      GOMODCACHE: /root/go/pkg/mod

    steps:
      - name: Install base dependencies
        run: apk add --no-cache bash coreutils git go util-linux

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Go modules (alpine)
        uses: actions/cache@v4
        with:
          path: |
            /root/.cache/go-build
            /root/go/pkg/mod
          key: go-mod-alpine-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-alpine-

      - name: Run go vet
        run: |
          VET_LOG="/tmp/pocket-vet-alpine.log"
          if go vet ./... >"${VET_LOG}" 2>&1; then
            VET_EXIT=0
          else
            VET_EXIT=$?
          fi
          cat "${VET_LOG}"
          exit "${VET_EXIT}"

      - name: Run menu regression suite
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          MENU_LOG="/tmp/pocket-menu-alpine.log"
          MENU_EXIT=0
          : > "${MENU_LOG}"
          for TEST_SCRIPT in \
            tests/test_menu_fallback.sh \
            tests/test_menu_incremental_render.sh \
            tests/test_menu_no_hosts.sh \
            tests/test_menu_remove_host.sh
          do
            TEST_NAME=$(basename "${TEST_SCRIPT}")
            printf '==> %s\n' "${TEST_NAME}" >> "${MENU_LOG}"
            if sh "${TEST_SCRIPT}" >> "${MENU_LOG}" 2>&1; then
              :
            else
              MENU_EXIT=$?
              break
            fi
          done
          cat "${MENU_LOG}"
          END_TS=$(date +%s)
          printf '### Menu regressions (alpine)\n' >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- total: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          exit "${MENU_EXIT}"

      - name: Run shell regression suite
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_TEST_EXCLUDES: test_ish.sh test_menu_fallback.sh test_menu_incremental_render.sh test_menu_no_hosts.sh test_menu_remove_host.sh
        run: |
          TEST_LOG="/tmp/pocket-test-alpine.log"
          if sh tests/run_all.sh >"${TEST_LOG}" 2>&1; then
            TEST_EXIT=0
          else
            TEST_EXIT=$?
          fi
          cat "${TEST_LOG}"
          exit "${TEST_EXIT}"

      - name: Run Go tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          GO_LOG="/tmp/pocket-gotest-alpine.log"
          if go test ./... >"${GO_LOG}" 2>&1; then
            GO_EXIT=0
          else
            GO_EXIT=$?
          fi
          cat "${GO_LOG}"
          END_TS=$(date +%s)
          printf '### Go tests (alpine)\n' >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- total: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          exit "${GO_EXIT}"

      - name: Build pocket Go binary
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          BUILD_LOG="/tmp/pocket-build-alpine.log"
          if go build -buildvcs=false -o /tmp/pocket-go ./cmd/pocket >"${BUILD_LOG}" 2>&1; then
            BUILD_EXIT=0
          else
            BUILD_EXIT=$?
          fi
          cat "${BUILD_LOG}"
          END_TS=$(date +%s)
          printf '### Build (alpine)\n' >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- pocket-go: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          exit "${BUILD_EXIT}"

      - name: Run pocket smoke tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_GO_BINARY: /tmp/pocket-go
        run: |
          SMOKE_LOG="/tmp/pocket-smoke-alpine.log"
          if sh tests/run_smoke.sh >"${SMOKE_LOG}" 2>&1; then
            SMOKE_EXIT=0
          else
            SMOKE_EXIT=$?
          fi
          cat "${SMOKE_LOG}"
          exit "${SMOKE_EXIT}"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-alpine
          path: |
            /tmp/pocket-vet-alpine.log
            /tmp/pocket-menu-alpine.log
            /tmp/pocket-build-alpine.log
            /tmp/pocket-test-alpine.log
            /tmp/pocket-gotest-alpine.log
            /tmp/pocket-smoke-alpine.log
          retention-days: 7
