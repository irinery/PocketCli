name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    name: Build and smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            ci_profile: linux
            go_test_cmd: go test ./...
          - name: macos
            os: macos-latest
            ci_profile: macos
            go_test_cmd: go test ./...

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true   # restaura módulos e build cache automaticamente

      - name: Run go vet
        run: go vet ./...

      - name: Run shell regression suite
        env:
          POCKETCLI_CI_PROFILE: ${{ matrix.ci_profile }}
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_TEST_EXCLUDES: test_ish.sh
        run: sh tests/run_all.sh

      - name: Run Go tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          GO_LOG="/tmp/pocket-gotest-${{ matrix.ci_profile }}.log"
          if ${{ matrix.go_test_cmd }} >"${GO_LOG}" 2>&1; then
            GO_EXIT=0
          else
            GO_EXIT=$?
          fi
          cat "${GO_LOG}"
          END_TS=$(date +%s)
          printf '### Go tests (%s)\n' "${{ matrix.ci_profile }}" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- total: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          exit "${GO_EXIT}"

      - name: Build pocket Go binary
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          go build -buildvcs=false -o /tmp/pocket-go ./cmd/pocket
          END_TS=$(date +%s)
          printf '### Build (%s)\n' "${{ matrix.ci_profile }}" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- pocket-go: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"

      - name: Run pocket smoke tests
        env:
          POCKETCLI_CI_PROFILE: ${{ matrix.ci_profile }}
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_GO_BINARY: /tmp/pocket-go
        run: |
          SMOKE_LOG="/tmp/pocket-smoke-${{ matrix.ci_profile }}.log"
          if sh tests/run_smoke.sh >"${SMOKE_LOG}" 2>&1; then
            SMOKE_EXIT=0
          else
            SMOKE_EXIT=$?
          fi
          cat "${SMOKE_LOG}"
          exit "${SMOKE_EXIT}"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.ci_profile }}
          path: |
            /tmp/pocket-gotest-${{ matrix.ci_profile }}.log
            /tmp/pocket-smoke-${{ matrix.ci_profile }}.log
          retention-days: 7

  build-and-smoke-alpine:
    name: Build and smoke (alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: alpine:3.21
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "768MiB"
      POCKETCLI_CI_PROFILE: alpine

    steps:
      - name: Install base dependencies
        run: apk add --no-cache bash coreutils git go util-linux

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Go modules (alpine)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-mod-alpine-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-alpine-

      - name: Run go vet
        run: go vet ./cmd/pocket ./internal/...

      - name: Run shell regression suite
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_TEST_EXCLUDES: test_ish.sh
        run: sh tests/run_all.sh

      - name: Run focused Go tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          GO_LOG="/tmp/pocket-gotest-alpine.log"
          if go test ./cmd/pocket ./internal/... >"${GO_LOG}" 2>&1; then
            GO_EXIT=0
          else
            GO_EXIT=$?
          fi
          cat "${GO_LOG}"
          END_TS=$(date +%s)
          printf '### Go tests (alpine)\n' >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- total: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          exit "${GO_EXIT}"

      - name: Build pocket Go binary
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          go build -buildvcs=false -o /tmp/pocket-go ./cmd/pocket
          END_TS=$(date +%s)
          printf '### Build (alpine)\n' >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- pocket-go: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"

      - name: Run pocket smoke tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_GO_BINARY: /tmp/pocket-go
        run: |
          SMOKE_LOG="/tmp/pocket-smoke-alpine.log"
          if sh tests/run_smoke.sh >"${SMOKE_LOG}" 2>&1; then
            SMOKE_EXIT=0
          else
            SMOKE_EXIT=$?
          fi
          cat "${SMOKE_LOG}"
          exit "${SMOKE_EXIT}"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-alpine
          path: |
            /tmp/pocket-gotest-alpine.log
            /tmp/pocket-smoke-alpine.log
          retention-days: 7
