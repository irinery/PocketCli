name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell-tests:
    name: Shell test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shell-based regression tests
        run: |
          set -euo pipefail
          for t in tests/test_bootstrap_install.sh tests/test_menu_fallback.sh tests/test_menu_no_hosts.sh tests/test_pocket_resume.sh tests/test_pocket_update.sh tests/test_radar_fallback.sh tests/test_scan_fallback.sh tests/test_tailscale_setup_fallback.sh; do
            echo "==> running ${t}"
            sh "${t}"
          done

  go-tests:
    name: Go tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go test
        run: go test ./...

      - name: Build pocket binary
        run: go build -o /tmp/pocket ./cmd/pocket

  viewer-ish-sim:
    name: Viewer-ish (Alpine-like + mocked tailscale)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "768MiB"

    steps:
      - name: Install base dependencies (without tailscale)
        run: apk add --no-cache bash git go

      - name: Checkout
        uses: actions/checkout@v4

      - name: Provide mocked tailscale binary
        run: |
          cat > /usr/local/bin/tailscale <<'TS'
          #!/usr/bin/env sh
          set -eu
          if [ "$#" -eq 2 ] && [ "$1" = "status" ] && [ "$2" = "--json" ]; then
            printf '{"Peer":{"viewer":{"HostName":"viewer","TailscaleIPs":["100.64.0.10"],"Online":false,"OS":"linux"}}}'
            exit 0
          fi
          echo "mock tailscale: unsupported args: $*" >&2
          exit 1
          TS
          chmod +x /usr/local/bin/tailscale

      - name: Run focused go test suite under constrained env
        run: go test ./cmd/pocket ./internal/...
