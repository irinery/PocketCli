name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    name: Build and smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            ci_profile: linux
            go_test_cmd: go test ./...
          - name: macos
            os: macos-latest
            ci_profile: macos
            go_test_cmd: go test ./...

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run shell regression suite
        env:
          POCKETCLI_CI_PROFILE: ${{ matrix.ci_profile }}
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_TEST_EXCLUDES: test_ish.sh
        run: sh tests/run_all.sh

      - name: Run Go tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          ${{ matrix.go_test_cmd }}
          END_TS=$(date +%s)
          printf '### Go tests (%s)\n' "${{ matrix.ci_profile }}" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- total: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"

      - name: Build pocket Go binary
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          go build -o /tmp/pocket-go ./cmd/pocket
          END_TS=$(date +%s)
          printf '### Build (%s)\n' "${{ matrix.ci_profile }}" >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- pocket-go: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"

      - name: Run pocket smoke tests
        env:
          POCKETCLI_CI_PROFILE: ${{ matrix.ci_profile }}
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_GO_BINARY: /tmp/pocket-go
        run: sh tests/run_smoke.sh

  build-and-smoke-alpine:
    name: Build and smoke (alpine)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "768MiB"
      POCKETCLI_CI_PROFILE: alpine

    steps:
      - name: Install base dependencies
        run: apk add --no-cache bash coreutils git go util-linux

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shell regression suite
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_TEST_EXCLUDES: test_ish.sh
        run: sh tests/run_all.sh

      - name: Run focused Go tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          go test ./cmd/pocket ./internal/...
          END_TS=$(date +%s)
          printf '### Go tests (alpine)\n' >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- total: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"

      - name: Build pocket Go binary
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          START_TS=$(date +%s)
          go build -o /tmp/pocket-go ./cmd/pocket
          END_TS=$(date +%s)
          printf '### Build (alpine)\n' >> "${POCKETCLI_CI_SUMMARY_FILE}"
          printf -- '- pocket-go: %ss\n' "$((END_TS - START_TS))" >> "${POCKETCLI_CI_SUMMARY_FILE}"

      - name: Run pocket smoke tests
        env:
          POCKETCLI_CI_SUMMARY_FILE: ${{ github.step_summary }}
          POCKETCLI_GO_BINARY: /tmp/pocket-go
        run: sh tests/run_smoke.sh
