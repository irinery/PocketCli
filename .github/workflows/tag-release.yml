name: Tag release

# Dispara somente após o workflow CI terminar no branch main.
# Isso garante que nenhuma tag seja criada sobre um commit com CI vermelho.
#
# ANTES: `on: push: branches: [main]` — disparava em paralelo com CI,
#         criando tag independentemente do resultado dos testes.
# AGORA:  `on: workflow_run` — dispara após CI terminar; o job verifica
#          a conclusão antes de prosseguir.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: tag-release-main
  cancel-in-progress: false   # nunca cancelar: evita tag parcialmente criada

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check CI conclusion
        id: gate
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${CI_CONCLUSION}" != "success" ]; then
            printf 'skip=true\n' >> "${GITHUB_OUTPUT}"
            echo "ℹ  CI terminou com conclusão '${CI_CONCLUSION}' para o SHA ${TARGET_SHA}."
            echo "ℹ  Nenhuma tag será criada."
            exit 0
          fi
          printf 'skip=false\n' >> "${GITHUB_OUTPUT}"
          echo "✔ CI verde para o SHA ${TARGET_SHA}; prosseguindo com a tag."

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Faz checkout no SHA exato que disparou o CI — não no HEAD atual,
          # que pode ter avançado enquanto o CI rodava.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch tags
        if: steps.gate.outputs.skip != 'true'
        run: git fetch --force --tags origin

      - name: Skip if HEAD already has a release tag
        id: existing
        if: steps.gate.outputs.skip != 'true'
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          EXISTING_TAG=$(git tag --points-at "${TARGET_SHA}" 'v*' | head -n 1 || true)
          if [ -n "${EXISTING_TAG}" ]; then
            printf 'tag=%s\n' "${EXISTING_TAG}" >> "${GITHUB_OUTPUT}"
            printf 'skip=true\n' >> "${GITHUB_OUTPUT}"
            echo "ℹ  SHA ${TARGET_SHA} já possui a tag ${EXISTING_TAG} — pulando."
            exit 0
          fi
          printf 'skip=false\n' >> "${GITHUB_OUTPUT}"

      - name: Compute next release tag
        id: next
        if: steps.gate.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        run: |
          NEXT_TAG=$(sh ./scripts/next_release_tag.sh)
          # Valida o formato antes de usar
          if ! echo "${NEXT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "✘ next_release_tag.sh retornou formato inválido: '${NEXT_TAG}'"
            exit 1
          fi
          printf 'tag=%s\n' "${NEXT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "✔ Próxima tag: ${NEXT_TAG}"

      - name: Create and push tag
        if: steps.gate.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        env:
          NEXT_TAG: ${{ steps.next.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${NEXT_TAG}" "${TARGET_SHA}"
          git push origin "${NEXT_TAG}"
          echo "✔ Tag ${NEXT_TAG} criada e enviada para origin (SHA: ${TARGET_SHA})"
