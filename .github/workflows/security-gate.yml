name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Secret Leak Scanner
        id: scanner_01
        run: bash scripts/security/run_scanner.sh 01 bash scripts/security/01_secret_leak_scanner.sh
        continue-on-error: true

      - name: Run Shell Injection Audit
        id: scanner_02
        run: bash scripts/security/run_scanner.sh 02 bash scripts/security/02_shell_injection_audit.sh
        continue-on-error: true

      - name: Run Filesystem Permission Audit
        id: scanner_03
        run: bash scripts/security/run_scanner.sh 03 bash scripts/security/03_filesystem_permission_audit.sh repo
        continue-on-error: true

      - name: Run SSH/Tailscale/tmux Hardening Audit
        id: scanner_04
        run: bash scripts/security/run_scanner.sh 04 bash scripts/security/04_ssh_tailscale_hardening.sh
        continue-on-error: true

      - name: Aggregate Results
        id: aggregate
        run: bash scripts/security/aggregate_results.sh
        env:
          EXIT_01: ${{ steps.scanner_01.outcome }}
          EXIT_02: ${{ steps.scanner_02.outcome }}
          EXIT_03: ${{ steps.scanner_03.outcome }}
          EXIT_04: ${{ steps.scanner_04.outcome }}

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: security-report.txt
          retention-days: 30

      - name: Fail if findings found
        if: steps.aggregate.outputs.has_blocking_findings == 'true'
        run: |
          echo "::error::Security gate failed. See security-report.txt artifact for details."
          exit 1
