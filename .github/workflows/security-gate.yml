name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run security scanners in parallel
        run: sh scripts/security/run_all_scanners.sh
        continue-on-error: true

      - name: Aggregate Results
        id: aggregate
        run: bash scripts/security/aggregate_results.sh

      - name: Upload Security Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: security-report.txt
          retention-days: 30

      - name: Fail if findings found
        if: steps.aggregate.outputs.has_blocking_findings == 'true'
        run: |
          echo "::error::Security gate failed. See security-report.txt artifact for details."
          exit 1
