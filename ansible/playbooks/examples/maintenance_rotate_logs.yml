- name: pocket_meta
  hosts: localhost
  gather_facts: false
  vars:
    pocket_meta:
      name: "maintenance_rotate_logs"
      description: "Executa rotação manual de logs"
      author: "pocketcli"
      version: "1.0.0"
      category: "maintenance"
      safe_modes:
        - check
        - diff
        - run
      inventory_source: merged
      tags: []
      min_ansible_version: "2.14"
      created_at: "2026-05-11"
      updated_at: "2026-05-11"
  tasks: []

- name: Rotacionar logs
  hosts: all
  gather_facts: false
  tasks:
    - name: Executar logrotate se disponível
      ansible.builtin.command: logrotate -f /etc/logrotate.conf
      changed_when: true
      tags: [logs]
