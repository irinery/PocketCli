- name: pocket_meta
  hosts: localhost
  gather_facts: false
  vars:
    pocket_meta:
      name: "network_check_connectivity"
      description: "Testa conectividade básica de rede"
      author: "pocketcli"
      version: "1.0.0"
      category: "network"
      safe_modes:
        - check
        - diff
      inventory_source: merged
      tags: []
      min_ansible_version: "2.14"
      created_at: "2026-05-11"
      updated_at: "2026-05-11"
  tasks: []

- name: Checar conectividade
  hosts: all
  gather_facts: false
  tasks:
    - name: Testar resolução DNS
      ansible.builtin.command: getent hosts example.com
      changed_when: false
      tags: [network]
