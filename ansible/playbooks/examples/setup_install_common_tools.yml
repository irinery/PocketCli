- name: pocket_meta
  hosts: localhost
  gather_facts: false
  vars:
    pocket_meta:
      name: "setup_install_common_tools"
      description: "Instala ferramentas comuns de operação"
      author: "pocketcli"
      version: "1.0.0"
      category: "setup"
      safe_modes:
        - check
        - diff
        - run
      inventory_source: merged
      tags: []
      min_ansible_version: "2.14"
      created_at: "2026-05-11"
      updated_at: "2026-05-11"
  tasks: []

- name: Instalar ferramentas comuns
  hosts: all
  gather_facts: true
  tasks:
    - name: Garantir pacotes base
      ansible.builtin.package:
        name:
          - curl
          - git
          - htop
          - vim
        state: present
      tags: [install]
