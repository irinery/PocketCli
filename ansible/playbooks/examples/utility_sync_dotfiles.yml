- name: pocket_meta
  hosts: localhost
  gather_facts: false
  vars:
    pocket_meta:
      name: "utility_sync_dotfiles"
      description: "Sincroniza dotfiles operacionais"
      author: "pocketcli"
      version: "1.0.0"
      category: "utility"
      safe_modes:
        - check
        - diff
        - run
      inventory_source: merged
      tags: []
      min_ansible_version: "2.14"
      created_at: "2026-05-11"
      updated_at: "2026-05-11"
  tasks: []

- name: Sincronizar dotfiles
  hosts: all
  gather_facts: false
  tasks:
    - name: Criar diretório de configuração
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config"
        state: directory
        mode: "0755"
      tags: [config]
