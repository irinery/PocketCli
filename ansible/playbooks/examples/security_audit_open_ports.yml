- name: pocket_meta
  hosts: localhost
  gather_facts: false
  vars:
    pocket_meta:
      name: "security_audit_open_ports"
      description: "Audita portas abertas nos hosts"
      author: "pocketcli"
      version: "1.0.0"
      category: "security"
      safe_modes:
        - check
        - diff
      inventory_source: merged
      tags: []
      min_ansible_version: "2.14"
      created_at: "2026-05-11"
      updated_at: "2026-05-11"
  tasks: []

- name: Auditar portas abertas
  hosts: all
  gather_facts: false
  tasks:
    - name: Listar sockets TCP
      ansible.builtin.command: ss -tulpn
      changed_when: false
      tags: [audit]
