- name: pocket_meta
  hosts: localhost
  gather_facts: false
  vars:
    pocket_meta:
      name: "diagnostic_system_info"
      description: "Coleta informações básicas do sistema"
      author: "pocketcli"
      version: "1.0.0"
      category: "diagnostic"
      safe_modes:
        - check
        - diff
      inventory_source: merged
      tags: []
      min_ansible_version: "2.14"
      created_at: "2026-05-11"
      updated_at: "2026-05-11"
  tasks: []

- name: Coletar informações do sistema
  hosts: all
  gather_facts: true
  tasks:
    - name: Exibir OS e uptime
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} {{ ansible_distribution }} {{ ansible_uptime_seconds | default('n/a') }}"
      tags: [info]
