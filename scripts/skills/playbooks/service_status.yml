---
- name: PocketCli service status
  hosts: all
  gather_facts: false
  vars:
    service_name: ""
  tasks:
    - name: Validate service name
      ansible.builtin.assert:
        that:
          - service_name is match('^[A-Za-z0-9_.@-]{1,80}$')
        fail_msg: "service_name invalido"

    - name: Read service status
      ansible.builtin.command: "systemctl is-active {{ service_name }}"
      changed_when: false
      failed_when: false
      register: pocket_service_status

    - name: pocket_result
      ansible.builtin.debug:
        msg:
          service_name: "{{ service_name }}"
          state: "{{ pocket_service_status.stdout | default('unknown') }}"
          changed: false
